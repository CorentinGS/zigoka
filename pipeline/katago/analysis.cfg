# KataGo analysis engine settings for labelling (go_pipeline.analysis).
# Throughput first: many positions in flight, one search thread each, so
# the GPU sees full batches. Queries pass Moka's rules, komi, board size and
# maxVisits themselves; logDir is passed with -override-config.

logDir = katago_logs
logErrorsAndWarnings = true
warnUnusedFields = true

# Every value (winrate, scoreLead, ownership) from the side to move's
# perspective, like the student's value head.
reportAnalysisWinratesAs = SIDETOMOVE

# Labels describe the move the teacher would play: no extra root noise,
# and the real move history is part of the input, as in KataGo's training.
wideRootNoise = 0.0
ignorePreRootHistory = false

# On the Radeon (gfx1030, ROCm build, b18c384nbt, 19×19), `katago
# benchmark` peaks at 64 threads: 1 550 nnEvals/s, batches of 30. The
# OpenCL build tops out at 360.
maxVisits = 64
numAnalysisThreads = 64
numSearchThreadsPerAnalysisThread = 1
nnMaxBatchSize = 64

# 19×19 only: smaller buffers. Use another config for 9×9.
maxBoardXSizeForNNBuffer = 19
maxBoardYSizeForNNBuffer = 19
requireMaxBoardSize = true

# Labelling never revisits a position: a small cache keeps memory bounded
# (Moka v2 saw the analysis process grow past 25 GB).
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true
