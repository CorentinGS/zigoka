name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the commit subjects step reads the commits the push brings.
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: node scripts/check-commit-subjects.mjs "$BASE_SHA" "$HEAD_SHA" "origin/$DEFAULT_BRANCH"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: zig fmt --check src tools build.zig
      - run: pnpm exec tsc --noEmit
      # Zig's cache is content-addressed: a cache from an older commit only saves work.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('mise.toml', 'build.zig', 'src/**', 'tools/**', 'models/**', 'vendor/*/model/**') }}
          restore-keys: zig-${{ runner.os }}-
      # The steps of `pnpm check:all`, with the oracle fixtures cached. The key covers
      # everything the generator reads: the oracle, Moka's code and models, the bundling,
      # the toolchain. Any change to them regenerates the fixtures and checks that a
      # second generation gives the same bytes; the cache is saved only if the job passes.
      - id: oracle-fixtures
        uses: actions/cache@v4
        with:
          path: oracle/fixtures
          key: oracle-fixtures-${{ hashFiles('mise.toml', 'package.json', 'pnpm-lock.yaml', 'build.zig', 'oracle/*.ts', 'oracle/*.json', 'vendor/**', 'models/**', 'scripts/build-js.mjs', 'scripts/run-oracle.mjs') }}
      - run: pnpm gen
      - run: pnpm build
      - run: pnpm models:check
      - if: steps.oracle-fixtures.outputs.cache-hit != 'true'
        run: pnpm oracle
      - if: steps.oracle-fixtures.outputs.cache-hit != 'true'
        run: pnpm oracle:check
      - run: pnpm test
      - run: pnpm test:e2e
      # test:e2e rebuilds site/public, which is tracked and deployed: the committed site must be
      # that build. A fresh build in another folder, with an empty Zig cache, gives the same bytes.
      - name: site/public is the build of its sources
        run: |
          changes=$(git status --porcelain -- site/public)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "site/public differs from its build: run pnpm build and pnpm site:build, then commit site/public."
            exit 1
          fi
