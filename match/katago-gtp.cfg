# KataGo GTP settings for match/match.ts. match/katago.ts passes Moka's rules,
# maxVisits and logDir with -override-config, and sets the board size and komi
# over GTP. Every move gets exactly maxVisits: no resignation, no pondering, and
# no search reduction after a pass or when winning.

logAllGTPCommunication = false
logSearchInfo = false
logSearchInfoForChosenMove = false
logToStderr = false

allowResignation = false
resignThreshold = -1.0
resignConsecTurns = 3
maxVisits = 1
ponderingEnabled = false
maxTimePondering = 60.0
lagBuffer = 0
numSearchThreads = 1
searchFactorAfterOnePass = 1.0
searchFactorAfterTwoPass = 1.0
searchFactorWhenWinning = 1.0
searchFactorWhenWinningThreshold = 1.0
